name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (package + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest tests/unit/
        run: pytest tests/unit/ -v --tb=short

      - name: pytest tests/integration/
        run: pytest tests/integration/ -v --tb=short

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Kept in lockstep with the `dev` extra in pyproject.toml. The old
      # "ruff~=0.1" allowed any minor below 1.0, so a new default rule set
      # could turn this job red with no change on our side.
      - name: Install ruff
        run: pip install "ruff>=0.16,<0.17"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Added in v0.1.6. The dev extra sat on pytest 7.4.4 and black 23.12.1
      # for months, carrying four advisories nothing was watching for.
      - name: Install (package + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: pip-audit
        run: pip-audit --progress-spinner off
